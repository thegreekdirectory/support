<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} — The Greek Directory Support{% else %}Support Center — The Greek Directory{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title | default: 'Support Center' }} — The Greek Directory">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Greek Directory">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="https://static.thegreekdirectory.org/img/logo/blue.svg">

  <!-- Favicon -->
  <link rel="icon" href="https://static.thegreekdirectory.org/img/logo/bluefavicon.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="https://static.thegreekdirectory.org/img/logo/whitefavicon.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="https://static.thegreekdirectory.org/img/logo/app1.png">

  <!-- Preconnect -->
  <link rel="preconnect" href="https://static.thegreekdirectory.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/main.css">

  {% seo %}
</head>
<body>

  {% include header.html %}

  {{ content }}

  {% include footer.html %}

</body>
</html>
