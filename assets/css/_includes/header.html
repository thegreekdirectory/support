<header id="supportHeader">
  <div class="support-header-inner">

    <a href="/" class="support-header-logo" aria-label="The Greek Directory — Home">
      <img src="https://static.thegreekdirectory.org/img/logo/blue.svg" alt="The Greek Directory">
    </a>

    <nav class="support-header-breadcrumb" aria-label="Site section">
      <a href="https://thegreekdirectory.org/">Main Site</a>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Support Center</span>
    </nav>

    <nav class="support-header-nav" id="supportHeaderNav" aria-label="Header navigation">
      <a href="https://thegreekdirectory.org/">Main Site</a>
      <a href="https://thegreekdirectory.org/listings">Directory</a>
      <a href="{{ '/' | relative_url }}">Support Home</a>
      <a href="https://thegreekdirectory.org/business" class="support-nav-cta">Business Portal</a>
    </nav>

    <button id="supHamburgerBtn" aria-label="Open menu">
      <svg id="supHamIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
      <svg id="supHamClose" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- Mobile dropdown -->
  <div id="supHamDropdown" style="display:none; border-top:1px solid #e5e7eb; background:#fff;">
    <div style="max-width:1160px;margin:0 auto;padding:0.75rem 1.5rem;display:flex;flex-direction:column;gap:0.25rem;">
      <a href="https://thegreekdirectory.org/" class="ham-link">Main Site</a>
      <a href="https://thegreekdirectory.org/listings" class="ham-link">Directory</a>
      <a href="{{ '/' | relative_url }}" class="ham-link" style="color:#045093;font-weight:600;">Support Home</a>
      <div style="padding-top:0.5rem;border-top:1px solid #f3f4f6;margin-top:0.25rem;">
        <a href="https://thegreekdirectory.org/business" class="ham-cta-link">Business Portal</a>
      </div>
    </div>
  </div>
</header>

<div class="support-header-spacer"></div>

<script>
(function() {
  var fullNav  = document.getElementById('supportHeaderNav');
  var hambBtn  = document.getElementById('supHamburgerBtn');
  var hambDrop = document.getElementById('supHamDropdown');
  var hamIcon  = document.getElementById('supHamIcon');
  var hamClose = document.getElementById('supHamClose');
  var open     = false;

  function measure() {
    fullNav.style.display = 'flex';
    hambBtn.style.display = 'none';
    var header    = fullNav.closest('.support-header-inner');
    var logoW     = header.querySelector('.support-header-logo').offsetWidth;
    var breadW    = (header.querySelector('.support-header-breadcrumb') || {offsetWidth:0}).offsetWidth;
    var available = header.clientWidth - logoW - breadW - 56;
    if (fullNav.scrollWidth > available) {
      fullNav.style.display = 'none';
      hambBtn.style.display = 'flex';
    }
  }

  function toggle() {
    open = !open;
    hambDrop.style.display = open ? 'block' : 'none';
    hamIcon.style.display  = open ? 'none'  : 'block';
    hamClose.style.display = open ? 'block' : 'none';
  }

  hambBtn.addEventListener('click', toggle);
  document.addEventListener('click', function(e) {
    if (open && !hambBtn.contains(e.target) && !hambDrop.contains(e.target)) {
      open = false;
      hambDrop.style.display = 'none';
      hamIcon.style.display  = 'block';
      hamClose.style.display = 'none';
    }
  });

  measure();
  window.addEventListener('resize', measure);
})();
</script>
